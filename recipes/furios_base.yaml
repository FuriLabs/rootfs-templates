{{- $architecture := or .architecture "arm64" -}}
{{- $suite := "forky" -}}

architecture: {{ $architecture }}
actions:

  - action: debootstrap
    suite: {{ $suite }}
    components:
      - main
    mirror: http://debian.furios.io/
    variant: minbase

  - action: overlay
    source: ../apt
    description: Adding apt overlay
    destination: /

  - action: run
    description: install apt config
    chroot: true
    script: ../scripts/install-apt-config.sh

  - action: run
    description: Clean repositories
    chroot: true
    script: ../scripts/clean-bootstrap-repositories.sh

  - action: run
    description: Build configuration
    chroot: true
    script: ../scripts/build-configuration.sh configure

  - action: apt
    chroot: true
    description: install glycin
    packages:
      - glycin-loaders
      - glycin-thumbnailers
      - libglycin-2-0
      - libgdk-pixbuf-2.0-0

  - action: apt
    chroot: true
    description: install furios-base metapackage
    packages:
      - furios-base
