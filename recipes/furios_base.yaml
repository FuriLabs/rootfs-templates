{{- $architecture := or .architecture "arm64" -}}
{{- $suite := "forky" -}}
{{- $version := or .version "nightly" -}}

architecture: {{ $architecture }}
actions:

  - action: debootstrap
    suite: {{ $suite }}
    components:
      - main
    mirror: http://debian.furios.io/
    variant: minbase

  - action: overlay
    source: ../apt
    description: Adding apt overlay
    destination: /

  - action: run
    chroot: true
    description: Install APT configuration
    script: ../scripts/install-package.sh ca-certificates furios-apt-config furios-apt-config-sync furios-archive-keyring

  - action: run
    description: Clean repositories
    chroot: true
    script: ../scripts/clean-bootstrap-repositories.sh

{{ if eq $version "staging" }}
  - action: run
    chroot: true
    description: Install staging APT configuration
    script: ../scripts/install-package.sh furios-apt-config-staging furios-apt-config-debian-staging furios-apt-config-sync-staging
{{ end }}

  - action: run
    description: Build configuration
    chroot: true
    script: ../scripts/build-configuration.sh configure

  - action: run
    chroot: true
    description: Install glycin
    script: ../scripts/install-package.sh glycin-loaders glycin-thumbnailers libglycin-2-0 libgdk-pixbuf-2.0-0

  - action: run
    chroot: true
    description: Install furios-base metapackage
    script: ../scripts/install-package.sh furios-base
