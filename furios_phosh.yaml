{{- $architecture := or .architecture "arm64" -}}
{{- $apilevel := or .apilevel "28" -}}
{{- $suite := "forky" -}}
{{- $version := or .version "nightly" -}}
{{- $variant := or .variant "phone" -}}

{{- $username := or .username "furios" -}}
{{- $password := or .password "1234" -}}
{{- $hostname := or .hostname "furios" -}}

architecture: {{ $architecture }}
actions:

  - action: recipe
    description: create rootfs
    recipe: furios_gsi_base.yaml
    variables:
      architecture: {{ $architecture }}
      apilevel: {{ $apilevel }}
      suite: {{ $suite }}
      username: {{ $username }}
      password: {{ $password }}
      hostname: {{ $hostname }}

  - action: apt
    chroot: true
    description: install furios-phosh
    packages:
      - furios-phosh-full

{{ if eq $variant "phone" }}
  - action: apt
    chroot: true
    description: install packages for the phone variant
    packages:
      - adaptation-hybris-api{{ $apilevel }}-phone
      - furios-phosh-phone
{{end}}

{{ if eq $version "nightly" }}
  - action: apt
    chroot: true
    description: install devtools (nightly)
    packages:
      - furios-devtools
      - furios-quirks-regenerate-ssh-keys
      - adaptation-hybris-devtools
{{end}}

  - action: apt
    chroot: true
    description: install furios-extras
    packages:
      - furios-extras

  - action: run
    description: clean phosh
    chroot: true
    script: scripts/clean-phosh.sh
