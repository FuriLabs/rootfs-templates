{{- $architecture := or .architecture "arm64" -}}
{{- $apilevel := or .apilevel "28" -}}
{{- $suite := "forky" -}}
{{- $version := or .version "nightly" -}}
{{- $variant := or .variant "phone" -}}

{{- $username := or .username "furios" -}}
{{- $password := or .password "1234" -}}
{{- $hostname := or .hostname "furios" -}}

architecture: {{ $architecture }}
actions:

  - action: recipe
    description: create rootfs
    recipe: furios_gsi_base.yaml
    variables:
      architecture: {{ $architecture }}
      apilevel: {{ $apilevel }}
      suite: {{ $suite }}
      version: {{ $version }}
      username: {{ $username }}
      password: {{ $password }}
      hostname: {{ $hostname }}

  - action: run
    chroot: true
    description: Install furios-phosh
    script: scripts/install-package.sh furios-phosh-full

{{ if eq $variant "phone" }}
  - action: run
    chroot: true
    description: Install packages for the phone variant
    script: scripts/install-package.sh adaptation-hybris-api{{ $apilevel }}-phone furios-phosh-phone
{{ end }}

{{ if eq $version "nightly" }}
  - action: run
    chroot: true
    description: Install devtools (nightly)
    script: scripts/install-package.sh furios-devtools furios-quirks-regenerate-ssh-keys adaptation-hybris-devtools
{{ end }}

  - action: run
    chroot: true
    description: Install furios-extras
    script: scripts/install-package.sh furios-extras

  - action: run
    description: clean phosh
    chroot: true
    script: scripts/clean-phosh.sh
